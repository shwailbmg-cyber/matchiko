# Loads the database migrations and Edge Functions into the Supabase project.
# Run by hand: Actions → "Deploy Supabase" → Run workflow.
# Needs repo secrets SUPABASE_DB_URL (session pooler connection string) and
# SUPABASE_ACCESS_TOKEN (Edge Functions only). See docs/SUPABASE.md.
# Never runs on pull requests.
name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      reset:
        description: "Wipe the database and reload every migration (first setup only: deletes all data)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: eehviixaazixayquzurd
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

jobs:
  deploy:
    name: Migrations and Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest
      - name: Reset and reload (first setup)
        if: ${{ inputs.reset }}
        run: supabase db reset --db-url "$SUPABASE_DB_URL" --no-seed --yes
      - name: Apply new migrations
        if: ${{ !inputs.reset }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Deploy Edge Functions
        run: supabase functions deploy push --project-ref "$SUPABASE_PROJECT_REF" --use-api
