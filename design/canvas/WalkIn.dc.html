<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manager walk-in booking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Cairo:wght@400;600;700;800;900&amp;display=swap">
<style>
body{margin:0;background:#06110b}
a{color:#3ddc84}a:hover{color:#7eeaae}
button,input,select{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #020805; color: #eaf5ee; font-family: Cairo, system-ui, sans-serif; position: relative; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: #0a1a10; border-top: 1px solid rgba(190,255,210,.18); border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 12px">
<span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(190,255,210,.18)"></span>
<h2 style="margin: 0; font-size: 20px; font-weight: 900">New booking</h2>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: #0e2016; border: 1px solid rgba(190,255,210,.09)">
<button style="height: 40px; border-radius: 12px; border: 0; background: #3ddc84; color: #04200f; font-weight: 800; font-size: 13px">One time</button>
<button style="height: 40px; border-radius: 12px; border: 0; background: transparent; color: #9dbfa9; font-weight: 800; font-size: 13px">Every week</button>
<button style="height: 40px; border-radius: 12px; border: 0; background: transparent; color: #9dbfa9; font-weight: 800; font-size: 13px">Block slot</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="cn" style="font-size: 12px; font-weight: 800; color: #9dbfa9">Customer name</label><input id="cn" value="Riad Mansouri" style="height: 48px; border-radius: 13px; background: #0e2016; border: 1px solid rgba(190,255,210,.18); padding: 0 12px; color: #eaf5ee; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="cp" style="font-size: 12px; font-weight: 800; color: #9dbfa9">Phone</label><input id="cp" value="0661 23 45 67" style="height: 48px; border-radius: 13px; background: #0e2016; border: 1px solid rgba(190,255,210,.18); padding: 0 12px; color: #eaf5ee; font-size: 15px; direction: ltr"></div>
</div>
<div style="font-size: 12px; color: #9dbfa9; margin-top: -4px">Riad has the app · 92% reliable. The booking goes to his account too.</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="pi" style="font-size: 12px; font-weight: 800; color: #9dbfa9">Pitch</label><select id="pi" style="height: 48px; border-radius: 13px; background: #0e2016; border: 1px solid rgba(190,255,210,.18); padding: 0 8px; color: #eaf5ee; font-size: 14px"><option>Terrain 1</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="da" style="font-size: 12px; font-weight: 800; color: #9dbfa9">Day</label><select id="da" style="height: 48px; border-radius: 13px; background: #0e2016; border: 1px solid rgba(190,255,210,.18); padding: 0 8px; color: #eaf5ee; font-size: 14px"><option>Mon 12</option></select></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ti" style="font-size: 12px; font-weight: 800; color: #9dbfa9">Time</label><select id="ti" style="height: 48px; border-radius: 13px; background: #0e2016; border: 1px solid rgba(190,255,210,.18); padding: 0 8px; color: #eaf5ee; font-size: 14px"><option>22:00</option></select></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 800; color: #9dbfa9">Size</span>
<div style="display: flex; gap: 6px">
<button style="flex: 1; height: 40px; border-radius: 12px; border: 1px solid rgba(190,255,210,.09); background: #0e2016; color: #9dbfa9; font-weight: 700">5v5</button>
<button style="flex: 1; height: 40px; border-radius: 12px; border: 1px solid rgba(190,255,210,.09); background: #0e2016; color: #9dbfa9; font-weight: 700">6v6</button>
<button style="flex: 1; height: 40px; border-radius: 12px; border: 1px solid #3ddc84; background: rgba(61,220,132,.14); color: #3ddc84; font-weight: 800">7v7</button>
</div>
</div>

<div style="background: #0e2016; border: 1px solid rgba(190,255,210,.09); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #9dbfa9">Price (night)</span><b>2 500 DA</b></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #9dbfa9">Booked in the app?</span><b style="color: #9dbfa9">No · no commission</b></div>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #0e2016; border: 1px solid rgba(190,255,210,.09)">
<div style="flex: 1"><b style="font-size: 14px">Lend bibs and ball</b><div style="font-size: 12px; color: #9dbfa9">Deposit 500 DA</div></div>
<span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: rgba(61,220,132,.14); color: #3ddc84">On</span>
</div>

<button style="margin-top: auto; height: 56px; border-radius: 17px; border: 0; background: #3ddc84; color: #04200f; font-weight: 800; font-size: 16px">Save booking</button>
</div>
</div>
</x-dc>

</body>
</html>
